  <style>
    /* 首页专属样式 —— 只写页面布局与开屏横幅；纸卡 / 按钮 / 便签 / 工具条 / 卡片等

    /* ---------- 开屏横幅：贴在网格纸上的手绘海报 ----------

      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 4fr);
      gap: var(--space-5);
      transform: rotate(-0.5deg);
    }
    .hero-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--space-3);
      padding: var(--space-6) var(--space-5);
    }
    .hero-title {
      width: fit-content;
      margin: 0;
      font-family: var(--font-marker);
      font-weight: normal;
      font-size: calc(var(--text-hero) * 1.8);
      line-height: var(--leading-tight);
      transform: rotate(-1deg);
    }
    .hero-subtitle {
      width: fit-content;

      font-size: var(--text-xl);
      color: var(--text-secondary);
      transform: rotate(0.5deg);
    }
    .hero-lede {
      margin: 0;

      font-size: var(--text-lg);
      color: var(--text-secondary);
      max-width: var(--measure-base);
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      margin-top: var(--space-2);
    }
    .btn svg { flex: none; }

    /* 右侧照片墙：拍立得拼贴。浅蓝底衬（--sticky-* 渐变），主角是贴上去的照片。 */

      align-items: center;

      padding: var(--space-5);
      background: linear-gradient(135deg, var(--sticky-1), var(--sticky-2));
      border: 2px dashed var(--ink);
      border-radius: var(--radius-sketchy-alt);
    }
    .hero-collage {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-3);
      width: min(100%, calc(var(--space-10) * 5));
    }
    .polaroid {
      position: relative;
      padding: var(--space-1) var(--space-1) var(--space-2);
      background: var(--paper-card);
      border: 2px solid var(--ink);
      border-radius: var(--radius-xs);

      transition: transform var(--duration-2) ease, box-shadow var(--duration-2) ease;
    }
    .polaroid img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: var(--radius-xs);
      background: var(--bg-inset);

    /* 错落微旋转：只给装饰性照片墙，不给输入控件；悬停与共享 .card 同一约定——摆正抬起 */

    .polaroid:nth-child(3n) { transform: rotate(-0.8deg) translateY(calc(var(--space-2) * -1)); }
    .polaroid:hover {

      box-shadow: var(--shadow-paper);
      z-index: 2;
    }
    /* 共享 .tape-strip 按大纸卡取 104px；照片胶带只缩尺寸、换倾角，不另起一套组件样式 */

  <!-- 旧链接兼容：单页应用时代的 hash 路由（#/work/<id>、#/character/<id>）跳到新静态页。
       slug 只从数据读（submissions/works.json 与 blue-fish-ids.json 的冻结映射），查不到回首页。 -->
  <script>
    (function () {
      "use strict";
      var hash = String(window.location.hash || "");
      if (hash.indexOf("#/") !== 0) return; /* 站内锚点（如 #gallery）不动 */
      var work = hash.match(/^#\/work\/([^/?#]+)/);
      if (work) {
        var id = decodeURIComponent(work[1]);
        var load = function (url) {
          return fetch(url, { cache: "no-cache" })
            .then(function (response) { return response.ok ? response.json() : []; })
            .catch(function () { return []; });
        };
        Promise.all([load("submissions/works.json"), load("blue-fish-ids.json")]).then(function (lists) {
          var slug = "";
          var tables = [lists[0], lists[1]];
          for (var i = 0; i < tables.length && !slug; i++) {
            var rows = Array.isArray(tables[i]) ? tables[i] : [];
            for (var j = 0; j < rows.length; j++) {
              if (rows[j] && rows[j].id === id && rows[j].slug) { slug = String(rows[j].slug); break; }
            }
          }
          window.location.replace(slug ? "works/" + slug + ".html" : "index.html");
        });
        return;
      }
      var character = hash.match(/^#\/character\/([^/?#]+)/);
      if (character) {
        window.location.replace("category.html#c=" + encodeURIComponent(decodeURIComponent(character[1])));
        return;
      }
      window.location.replace("index.html"); /* 认不出的旧 hash（含 #/）回首页 */
    })();
  </script>

  <script>
    (async function () {
      "use strict";

      var PAGE_SIZE = 24;
      var UPSTREAM_RAW = "https://raw.githubusercontent.com/EDMOK/blue-fish-archive/main/";

      /* 品类词（SEO 规范 §7 公式用）；categoryIds 初分口径见 kindOf */
      var KIND_WORDS = { meme: "表情包", illustration: "二创插画", setting: "立绘设定图" };

      var grid = document.getElementById("grid");
      var searchInput = document.getElementById("search");
      var sortSelect = document.getElementById("sort");
      var countEl = document.getElementById("count");
      var endNote = document.getElementById("end-note");
      var emptyEl = document.getElementById("empty");
      var sentinel = document.getElementById("sentinel");

      /* 归一：小写化并去掉空格 / 下划线 / 短横线后再比 */
      function normalize(value) {
        return String(value == null ? "" : value).toLowerCase().replace(/[\s_\-]+/g, "");
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
        });
      }

      /* FNV-1a：给 id 算稳定权重，「随机浏览」每次渲染顺序一致 */
      function hashId(id) {
        var h = 2166136261;
        for (var i = 0; i < id.length; i++) {
          h ^= id.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      async function fetchJson(url) {
        try {
          /* no-cache：清单走协商缓存（ETag / Last-Modified），变了照旧取回新内容 */
          var response = await fetch(url, { cache: "no-cache" });
          return response.ok ? await response.json() : null;
        } catch (error) {
          return null;
        }
      }

      function sourceFileName(value) {
        return String(value || "").split("/").pop();
      }

      /* categoryIds 初分：sticker_op_* → 插画；名称含 立绘/设定/三视图 → 设定图；其余 → 表情包 */
      function kindOf(id, name) {
        if (String(id || "").indexOf("sticker_op_") === 0) return "illustration";
        if (/立绘|设定|三视图/.test(String(name || ""))) return "setting";
        return "meme";
      }

      /* 收录门槛（与旧站 mapLocalRecord 同口径）：名称非空 + 至少 1 个 Tag + 角色非空 */
      function gate(record) {
        var name = String(record.name || "").trim();
        var tags = Array.isArray(record.tags)
          ? record.tags.map(function (tag) { return String(tag || "").trim(); }).filter(Boolean)
          : [];
        var characterId = String(record.characterId || "").trim();
        return name && tags.length && characterId ? { name: name, tags: tags, characterId: characterId } : null;
      }

      /* 投稿 / 站长自用清单已是契约形状；slug 只从数据读，缺 slug 记 warn 跳过 */
      function mapContractRecord(record) {
        if (!record || record.status !== "published") return null;
        var base = gate(record);
        if (!base) return null;
        var slug = String(record.slug || "").trim();
        if (!slug) {
          console.warn("[works] 记录缺 slug，跳过：", record.id || base.name);
          return null;
        }
        var thumb = String(record.thumbnailPath || "").replace(/^\/+/, "");
        var full = String(record.fullPath || record.thumbnailPath || "").replace(/^\/+/, "");
        return {
          id: String(record.id || ""),
          slug: slug,
          name: base.name,
          characterId: base.characterId,
          tags: base.tags,
          categoryIds: [kindOf(record.id, base.name)],
          format: String(record.format || "").toLowerCase(),
          isAnimated: !!record.isAnimated,
          width: Number(record.width) || 1,
          height: Number(record.height) || 1,
          fileSize: Number(record.fileSize) || 0,
          createdAt: String(record.createdAt || ""),
          thumbUrl: thumb,
          displayUrl: full,
          originalUrl: String(record.path || "")
        };
      }

      /* 首批 blue-fish：id / slug 按 sourcePath 查冻结映射（blue-fish-ids.json），查不到 warn 跳过。
         预览只取 previewPath||sourcePath 的 basename 拼 data/blue-fish/previews/；
         large 目录未部署，详情显示图同预览图（旧站 mapLocalRecord 语义）；
         原图拼上游 GitHub Raw。 */
      function mapBlueFishRecord(record, idMap) {
        if (!record) return null;
        var base = gate(record);
        if (!base) return null;
        var sourcePath = String(record.sourcePath || "");
        var frozen = idMap.get(sourcePath);
        if (!frozen || !frozen.id || !frozen.slug) {
          console.warn("[blue-fish] sourcePath 无冻结 id/slug，跳过：", sourcePath);
          return null;
        }
        var preview = "data/blue-fish/previews/" + encodeURIComponent(sourceFileName(record.previewPath || record.sourcePath));
        var format = String(record.format || "").toLowerCase();
        return {
          id: String(frozen.id),
          slug: String(frozen.slug),
          name: base.name,
          characterId: base.characterId,
          tags: base.tags,
          categoryIds: [kindOf(frozen.id, base.name)],
          format: format,
          isAnimated: format === "gif" || format === "apng",
          width: Number(record.width) || 1,
          height: Number(record.height) || 1,
          fileSize: Number(record.fileSize) || 0,
          createdAt: "2026-09-15T00:00:00+08:00",
          thumbUrl: preview,
          displayUrl: preview,
          originalUrl: UPSTREAM_RAW + sourcePath.replace(/^\/+/, "")
        };
      }

      /* 四份清单 + 角色清单 → 统一 works 数组，按收录时间倒序（同刻保持来源顺序） */
      async function loadWorks() {
        var results = await Promise.all([
          fetchJson("submissions/works.json"),
          fetchJson("owner-picks/works.json"),
          fetchJson("data/blue-fish-classification.json"),
          fetchJson("blue-fish-ids.json"),
          fetchJson("characters.json")
        ]);
        var idMap = new Map();
        (Array.isArray(results[3]) ? results[3] : []).forEach(function (row) {
          if (row && row.sourcePath) idMap.set(String(row.sourcePath), row);
        });
        var merged = [];
        var push = function (work) { if (work) merged.push(work); };
        (Array.isArray(results[0]) ? results[0] : []).forEach(function (record) { push(mapContractRecord(record)); });
        (Array.isArray(results[1]) ? results[1] : []).forEach(function (record) { push(mapContractRecord(record)); });
        (Array.isArray(results[2]) ? results[2] : []).forEach(function (record) { push(mapBlueFishRecord(record, idMap)); });
        return {
          characters: (Array.isArray(results[4]) ? results[4] : []).filter(function (c) { return c && c.id && c.id !== "all"; }),
          works: merged
            .map(function (work, index) { return { work: work, order: index }; })
            .sort(function (a, b) {
              return (Date.parse(b.work.createdAt) || 0) - (Date.parse(a.work.createdAt) || 0) || a.order - b.order;
            })
            .map(function (item) { return item.work; })
        };
      }

      var data = await loadWorks();
      var characters = data.characters;
      var works = data.works;
      var characterById = new Map(characters.map(function (c) { return [c.id, c]; }));

      var entries = works.map(function (work, index) {
        var character = characterById.get(work.characterId) || null;
        var fields = [work.name].concat(work.tags || []);
        if (character) {
          fields.push(character.name);
          fields.push.apply(fields, character.aliases || []);
        }
        return {
          work: work,
          index: index,
          characterName: character ? character.name : "未知角色",
          fields: fields.map(normalize),
          randomKey: hashId(String(work.id == null ? index : work.id))
        };
      });

      var comparators = {
        newest: function (a, b) { return a.index - b.index; },
        oldest: function (a, b) { return b.index - a.index; },
        "name-asc": function (a, b) {
          return String(a.work.name || "").localeCompare(String(b.work.name || ""), "zh") || a.index - b.index;
        },
        "name-desc": function (a, b) {
          return String(b.work.name || "").localeCompare(String(a.work.name || ""), "zh") || a.index - b.index;
        },
        size: function (a, b) { return (a.work.fileSize - b.work.fileSize) || a.index - b.index; },
        random: function (a, b) { return a.randomKey - b.randomKey || a.index - b.index; }
      };

      function parseQuery(raw) {
        return String(raw || "").split(/\s+/).map(normalize).filter(Boolean);
      }

      function matchesQuery(entry, tokens) {
        return tokens.every(function (token) {
          return entry.fields.some(function (field) { return field.indexOf(token) !== -1; });
        });
      }

      var filtered = [];
      var renderedCount = 0;

      /* 卡片图 alt（SEO规范.md §7 列表卡片图公式）：《{name}》{characterName}{kindWord}，{tags顿号}AI娘二创图 */
      function altFor(work) {
        var character = characterById.get(work.characterId);
        var characterName = character ? character.name : "未知角色";
        var kindId = (work.categoryIds || [])[0] || "";
        var kindWord = KIND_WORDS[kindId] || "表情包";
        var tags = (work.tags || []).slice(0, 2).join("、");
        var text = "《" + String(work.name == null ? "" : work.name) + "》" + characterName + kindWord;
        return tags ? text + "，" + tags + "AI娘二创图" : text;
      }

      function cardHtml(entry) {
        var work = entry.work;
        var tags = (work.tags || []).slice(0, 3).map(function (tag) { return "#" + tag; }).join(" ");
        var format = String(work.format || "").toUpperCase();
        var meta = entry.characterName + " · " + format + " · " + work.width + " × " + work.height;
        return (
          '<article class="card">' +
            `<a class="card-art-link" href="works/${work.slug}.html">` +
              '<img class="card-art" src="' + escapeHtml(work.thumbUrl) + '" alt="' + escapeHtml(altFor(work)) + '"' +
                ' width="' + escapeHtml(work.width) + '" height="' + escapeHtml(work.height) + '"' +
                ' loading="lazy" decoding="async" />' +
            '</a>' +
            '<div class="card-body">' +
              '<h3 class="card-title" title="' + escapeHtml(work.name) + '">' + escapeHtml(work.name) + '</h3>' +
              '<p class="card-meta">' + escapeHtml(meta) + '</p>' +
              '<p class="card-tags">' + escapeHtml(tags) + '</p>' +
            '</div>' +
          '</article>'
        );
      }

      function updateStatus() {
        var total = filtered.length;
        var shown = Math.min(renderedCount, total);
        countEl.textContent = "已显示 " + shown + " / " + total + " 张";
        var exhausted = total > 0 && renderedCount >= total;
        endNote.hidden = !exhausted;
        if (exhausted) {
          endNote.textContent = "已经到底了 · 共 " + total + " 张";
        }
        emptyEl.hidden = total !== 0;
      }

      function appendNextPage() {
        if (renderedCount >= filtered.length) { updateStatus(); return; }
        var slice = filtered.slice(renderedCount, renderedCount + PAGE_SIZE);
        grid.insertAdjacentHTML("beforeend", slice.map(cardHtml).join(""));
        renderedCount += slice.length;
        updateStatus();
      }

      function refresh() {
        var tokens = parseQuery(searchInput.value);
        var compare = comparators[sortSelect.value] || comparators.newest;
        filtered = entries.filter(function (entry) { return matchesQuery(entry, tokens); }).sort(compare);
        grid.innerHTML = "";
        renderedCount = 0;
        appendNextPage();
      }

      /* 事件只在初始化绑一次：卡片是委托处理，重渲染不重绑 */
      searchInput.addEventListener("input", refresh);
      sortSelect.addEventListener("change", refresh);
      var observer = new IntersectionObserver(function (records) {
        if (records.some(function (record) { return record.isIntersecting; })) { appendNextPage(); }
      }, { rootMargin: "320px 0px" });
      observer.observe(sentinel);

      refresh();
    })();
  </script>
</body>
</html>
