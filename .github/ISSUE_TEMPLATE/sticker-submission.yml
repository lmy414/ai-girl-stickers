name: 表情包投稿
description: 提交一张 AI 角色二创表情包，填写图片、名称和角色即可，维护者审核后补充信息并收录
title: "[投稿] "
labels: ["sticker-submission"]
body:
  - type: markdown
    attributes:
      value: |
        本站收集 **AI 角色的拟人化二创表情包**，是非官方同人档案。填写前请先看 [来源与授权说明](https://xn--pssy23gqgbz2d718b.com/#/about/license)。

        - 投稿时只需填写 **图片名称、角色**，一句话说明可选；Tag、分类、来源、授权和详情页文案由维护者审核时补充。
        - 支持格式：PNG、JPG、GIF、WebP、APNG；单张建议不超过 10 MB。
        - 图片请**直接拖进下面的「图片文件」框上传**，不要贴网盘或外链代替。
        - 与 AI 角色无关的通用表情包、真人肖像、未授权商业素材不收录。
        - 如果知道来源或授权信息，可以写在说明里，或在提交 Issue 后补充评论。
  - type: textarea
    id: name
    attributes:
      label: 图片名称
      description: 展示在卡片和详情页上的名字，会进入搜索。
      placeholder: 例如：不是……而是……大学习
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 一句话说明（可选）
      description: 这张图表达的情绪、场景，或你知道的来源 / 授权信息。
      placeholder: 例如：用于表达质疑或无语；自己生成，允许本站收录
    validations:
      required: false
  - type: dropdown
    id: character
    attributes:
      label: 角色
      description: 括号里是 `characterId`，收录时直接按它归档。不属于任何已收录角色的选「其他角色」。
      options:
        - "DeepSeek娘（deepseek · 别名 蓝色大肥鱼 / 鲸鱼娘）"
        - "豆包娘（doubao · 别名 豆包）"
        - "Kimi娘（kimi · 别名 Kimi）"
        - "通义千问娘（qwen · 别名 千问娘 / Qwen）"
        - "Claude娘（claude · 别名 Claude）"
        - "Gemini娘（gemini · 别名 Gemini）"
        - "Grok娘（grok · 别名 Grok）"
        - "Stepfun娘（stepfun · 别名 StepFun / 阶跃星辰）"
        - "GLM娘（glm · 别名 GLM / 智谱）"
        - "其他角色（other）"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 图片文件
      description: 把图片拖进这个框上传（上传后框里会自动出现图片引用，这就是必填内容）。
      placeholder: 拖入图片即可
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我确认自己有权提交这张图片，或已获得原作者允许。
          required: true
        - label: 我同意维护者核实后收录到蓝色大肥鱼，并在收到版权要求时修改信息或删除。
          required: true
        - label: 我知道本站是非官方同人整理项目，图片著作权始终归原作者。
          required: true
